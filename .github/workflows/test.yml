# Test workflow. Every push to main and every pull request builds the engine wheel natively,
# installs it with the package and the web and dev extras into a clean venv, and runs
# AmpZip/tests/run_tests.py on Linux, macOS and Windows with Python 3.12 and 3.13. The
# import step fails the job when the engine is missing, so the suite cannot pass empty.
# Nothing is published. Third-party actions are pinned to commit SHAs.
name: test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build the engine wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          working-directory: AmpZip/ampzip/engine
          args: --release --out ../../../dist
          sccache: "true"
      - name: Install into a clean venv
        shell: bash
        run: |
          python -m venv venv
          if [ -f venv/Scripts/python.exe ]; then PY=venv/Scripts/python.exe; else PY=venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --quiet --upgrade pip
          "$PY" -m pip install --quiet --no-index --find-links dist ampzip-engine
          "$PY" -m pip install --quiet "./AmpZip[web,dev]"
      - name: The engine imports from the wheel
        shell: bash
        run: '"$PY" -c "import ampzip, ampzip_engine; print(ampzip.__version__, ampzip_engine.__file__)"'
      - name: Run the test suites
        shell: bash
        run: '"$PY" AmpZip/tests/run_tests.py'
