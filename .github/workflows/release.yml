# Release workflow. Two tag prefixes:
#   ampzip-v<version>   builds and publishes amplens-engine + ampzip (versions move in lockstep)
#   amplens-v<version>  builds and publishes the amplens meta package
# Build -> check -> install into a clean venv and run the tests -> publish. Only the publish
# jobs hold `id-token: write`, and each runs in a GitHub environment with required reviewers
# (pypi-ampzip / pypi-amplens) and a trusted publisher on the PyPI side.
#
# Only final versions (X.Y.Z) and public pre-releases (X.Y.ZbN) are released here. Internal
# X.Y.Z.devN builds never reach a package index, and alpha, rc and local versions are
# rejected. Third-party actions are pinned to commit SHAs.
name: release

on:
  push:
    tags:
      - "ampzip-v*"
      - "amplens-v*"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.tag.outputs.component }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - id: tag
        name: Parse the tag and check it against the package versions
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            ampzip-v*)  component=ampzip;  version="${tag#ampzip-v}" ;;
            amplens-v*) component=amplens; version="${tag#amplens-v}" ;;
            *) echo "unexpected tag $tag"; exit 1 ;;
          esac
          python3 - "$component" "$version" <<'PY'
          import re, sys, pathlib
          component, version = sys.argv[1:]
          if not re.fullmatch(r"\d+\.\d+\.\d+(b\d+)?", version):
              sys.exit(f"{version}: only X.Y.Z or X.Y.ZbN is released")
          def declared(path):
              return re.search(r'^version\s*=\s*"([^"]+)"', pathlib.Path(path).read_text(), re.M).group(1)
          files = (["AmpZip/pyproject.toml", "AmpZip/ampzip/engine/pyproject.toml"] if component == "ampzip"
                   else ["amplens/pyproject.toml"])
          for f in files:
              v = declared(f)
              if v != version:
                  sys.exit(f"{f} declares {v}, tag says {version}")
          print(f"{component} {version}: tag matches {files}")
          PY
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- ampzip + amplens-engine
  engine-wheels:
    needs: resolve
    if: needs.resolve.outputs.component == 'ampzip'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64,  manylinux: auto }
          - { os: ubuntu-latest,  target: aarch64, manylinux: auto }
          - { os: macos-15,       target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the engine wheel (abi3, one per platform)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          working-directory: AmpZip/ampzip/engine
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out ../../../dist
          sccache: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: engine-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  engine-sdist:
    needs: resolve
    if: needs.resolve.outputs.component == 'ampzip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          working-directory: AmpZip/ampzip/engine
          command: sdist
          args: --out ../../../dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: engine-sdist
          path: dist/*.tar.gz

  ampzip-dist:
    needs: resolve
    if: needs.resolve.outputs.component == 'ampzip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
      - name: Build the ampzip wheel and sdist
        run: uv build --out-dir dist AmpZip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ampzip-dist
          path: dist/*

  verify-ampzip:
    needs: [resolve, engine-wheels, engine-sdist, ampzip-dist]   # resolve: its outputs are read below
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Metadata and wheel-content checks
        shell: bash
        run: |
          python -m pip install --quiet twine check-wheel-contents
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
      - name: Install from the built wheels into a clean venv and run the tests
        shell: bash
        run: |
          python -m venv venv
          if [ -f venv/Scripts/python.exe ]; then PY=venv/Scripts/python.exe; else PY=venv/bin/python; fi
          "$PY" -m pip install --quiet --upgrade pip
          "$PY" -m pip install --quiet --only-binary=:all: --find-links dist "ampzip[web,dev]==${{ needs.resolve.outputs.version }}" "amplens-engine==${{ needs.resolve.outputs.version }}"
          "$PY" -c "import ampzip, ampzip_engine; print(ampzip.__version__, ampzip.__file__)"
          "$PY" AmpZip/tests/run_tests.py

  publish-ampzip:
    needs: [resolve, verify-ampzip]
    runs-on: ubuntu-latest
    environment: pypi-ampzip
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish amplens-engine and ampzip
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
          verbose: true

  # ---------------------------------------------------------------- amplens
  amplens-dist:
    needs: resolve
    if: needs.resolve.outputs.component == 'amplens'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Build, check and smoke-test the meta package
        run: |
          uv build --out-dir dist amplens
          python -m pip install --quiet twine check-wheel-contents
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
          python -m venv venv
          venv/bin/python -m pip install --quiet --find-links dist "amplens==${{ needs.resolve.outputs.version }}"
          venv/bin/amplens components
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: amplens-dist
          path: dist/*

  publish-amplens:
    needs: [resolve, amplens-dist]
    runs-on: ubuntu-latest
    environment: pypi-amplens
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: amplens-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
          verbose: true
