# ~/.cloudflared/config.yml  (copy, then fill <TUNNEL_ID> and your hostname)
#
# Created by:  cloudflared tunnel create ampzip
# The create step writes credentials to ~/.cloudflared/<TUNNEL_ID>.json and
# prints the tunnel id — paste it below.

tunnel: <TUNNEL_ID>
credentials-file: /home/<user>/.cloudflared/<TUNNEL_ID>.json

# Outbound-only: cloudflared dials Cloudflare's edge; nothing listens publicly here.
ingress:
  # Public hostname → the local webservice. Use a NEW subdomain not already used
  # by your other server.
  - hostname: simp.YOURDOMAIN.com
    service: http://127.0.0.1:8000
  # Everything else 404s (required catch-all).
  - service: http_status:404
