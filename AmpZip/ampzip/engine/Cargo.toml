[package]
name = "ampzip_engine"
version = "1.0.0"
edition = "2021"
description = "Spinor-helicity move-execution engine for AmpZip (PyO3)"

[lib]
name = "ampzip_engine"
# rlib (alongside cdylib) lets `cargo test` build a test harness against the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.0" }
# Dedup keys: blake2b-128 of the canonical string, byte-identical to what the search used to
# compute in Python with hashlib (so checkpoints and run records stay comparable).
blake2 = "0.10"

[features]
# `extension-module` tells pyo3 not to link libpython, since the host Python provides its
# symbols. The wheel requires it and maturin enables it through pyproject.toml. It is left
# off for `cargo test`, so the test binary links libpython and the pure-Rust unit tests run.
extension-module = ["pyo3/extension-module"]
