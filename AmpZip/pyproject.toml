[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ampzip"
version = "1.0.0"
description = "Training-free simplification of spinor-helicity amplitudes: best-first search over value-preserving identities, with randomized finite-field checks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
  { name = "Yifan Fei" },
  { name = "Zhen Liu" },
]
keywords = ["scattering amplitudes", "spinor-helicity", "computer algebra", "symbolic simplification"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Mathematics",
]
# sympy is pinned to one minor series: its `str()` output defines the canonical spelling every
# recorded result is compared against. Widen only with a parity test against the stored corpus.
# The Rust engine is its own distribution, amplens-engine (built by maturin from ampzip/engine,
# import name ampzip_engine), and moves in lockstep with this one; `pip install ampzip` pulls the matching binary wheel.
dependencies = [
  "amplens-engine==1.0.*",
  "sympy>=1.13,<1.14",
  "numpy>=1.24",
  "platformdirs>=3",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2",
  "pyjwt>=2.8",
  # PyJWT's RS256 support, used only by Cloudflare Access authentication.
  # Excluded on Windows ARM and Intel macOS because cryptography has not provided
  # binary wheels for them since 46.0.4 and 49.0.0, and source builds require
  # Rust and OpenSSL.
  # Other authentication modes do not require it.
  "cryptography>=3.4; (sys_platform != 'win32' or platform_machine != 'ARM64') and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
]
# The learned backends run two upstream packages that `ampzip fetch-backends` clones onto the
# user's machine; these extras only install what those packages import.
# Both backends import the same upstream environment package, which pulls in all of these.
ml = ["torch>=2.0", "tqdm>=4.64", "gymnasium>=0.29", "pandas>=2", "diophantine>=0.2", "wolframclient>=1.1"]
sft = ["ampzip[ml]"]
cds = ["ampzip[ml]", "gdown>=5"]
# httpx: Starlette's TestClient, used by the web-service tests.
dev = ["pytest>=8", "maturin>=1.5,<2.0", "httpx>=0.27"]

[project.scripts]
ampzip = "ampzip.simplifier.cli:main"
ampzip-web = "ampzip.webservice.__main__:main"

[project.urls]
Homepage = "https://github.com/AmpLens/AmpLens"
Source = "https://github.com/AmpLens/AmpLens/tree/main/AmpZip"
Changelog = "https://github.com/AmpLens/AmpLens/blob/main/AmpZip/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["ampzip"]
exclude = ["ampzip/engine", "**/__pycache__"]

[tool.hatch.build.targets.sdist]
include = ["ampzip", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]
exclude = ["ampzip/engine/target", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"
